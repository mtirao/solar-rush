name: SolarRush
options:
  bundleIdPrefix: ar.com.wanaka
  developmentTeam: "E5YV4NK229" # Coloca tu ID de Apple Developer aquí si posees una
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  SolarRush:
    type: application
    # Configuramos múltiples plataformas nativas
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Sources
      - path: Sources/App/Assets.xcassets
        type: folder
        buildPhase: resources
    frameworks:
      - sdk: SpriteKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.wanaka.SolarRush
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Forzamos la orientación horizontal en dispositivos iOS (móviles)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Configuración específica para habilitar Mac Catalyst de forma nativa
        SUPPORTS_MACCATALYST: YES
        DERIVED_DATA_DIR: Build
      # Optimizaciones de compilación según la plataforma activa
      configs:
        Debug:
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          MTL_ENABLE_DEBUG_INFO: NO
